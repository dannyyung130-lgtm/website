<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AceJAMB</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="container">

    <div class="left">

        <div class="brand">
            <h1>AceJAMB</h1>
            <span>🎓</span>
        </div>

        <h2>Your journey to JAMB success starts here.</h2>

        <p>
            Practice smarter, track your progress,
            and prepare with confidence.
        </p>

    </div>


    <div class="right">

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p class="subtitle">
                Login to continue your AceJAMB journey.
            </p>


            <form id="loginForm">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword">
                        👁️
                    </button>

                </div>


                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>

            </form>


            <p class="register">

                Don't have an account?
                <a href="register.html">
                 Register
                </a>

            </p>

        </div>

    </div>

</div>


<script src="index.js"></script>

</body>
</html>
