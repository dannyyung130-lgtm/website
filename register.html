<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Giveaway Registration | Yung Gaming Hub</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <section class="register">

            <h1> Giveaway Registration</h1>

            <p> Fill in your details below to enter this week's giveaway.</p>

            <form id="giveaway-form"></form>

                <label> Free Fire Nickname</label>
                <input type="text" placeholder="Enter your nickname">

                <label>Free Fire UID</label>
                <input type="text" placeholder="Enter your Free Fire UID">

                <label>Server</label>
                <select>
                    <option>Africa</option>
                    <option>Europe</option>
                    <option>Asia</option>
                    <option>North America</option>
                    <option>South America</option>
                </select>

                <label>Email Address</label>
                <input type="email" placeholder="example@email.com">

                <button  type="submit">Submit Entry</button>

                <p id="success-message"></p>

       
            </form>

        </section>

     <script src="script.js"></script>
    </body>
</html>
